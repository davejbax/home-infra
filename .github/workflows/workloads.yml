name: workloads

on:
  pull_request:
    paths:
      - "workloads/**"
      - ".github/workflows/workloads.yml"
      - ".github/actions/setup/action.yml"
  push:
    branches: [ main ]
    paths:
      - "workloads/**"
      - ".github/workflows/workloads.yml"
      - ".github/actions/setup/action.yml"

# One update at a time. The DIY backend's locking is advisory, and cancelling a
# running `up` is worse than queueing behind it.
concurrency:
  group: pulumi-home-infra-workloads
  cancel-in-progress: false

jobs:
  preview:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # Protection rule: required reviewer. The run holds at this job until a
    # human approves it, so no pull request executes with credentials unseen.
    environment: preview
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_REGION: auto
      PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
      PULUMI_SELF_MANAGED_STATE_LOCKING: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
      - uses: pulumi/actions@v6
        with:
          command: preview
          stack-name: organization/home-infra/workloads
          work-dir: workloads
          comment-on-pr: true

  deploy:
    # Gated on the event and the ref, deliberately not written as the `else` of
    # the preview condition: a trigger added to `on:` later must fall through to
    # nothing, never to an apply.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Protection rule: deployment branches limited to `main`. A pull request
    # cannot borrow these credentials even by declaring this environment
    # itself -- GitHub refuses on the ref, before any step runs.
    environment: deploy
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_REGION: auto
      PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
      PULUMI_SELF_MANAGED_STATE_LOCKING: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
      - uses: pulumi/actions@v6
        with:
          command: up
          stack-name: organization/home-infra/workloads
          work-dir: workloads

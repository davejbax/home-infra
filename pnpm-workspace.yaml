packages:
  - metal
  - workloads

# Versions used by more than one project live here, so they're declared once.
catalog:
  "@pulumi/pulumi": ^3.260.0

# pnpm blocks postinstall scripts unless named. @pulumi/kubernetes' script
# fetches its provider plugin binary; protobufjs' generates its runtime shims.
# (@pulumi/tailscale needs no entry -- it has no install script, and Pulumi
# resolves its plugin at preview time instead.)
onlyBuiltDependencies:
  - "@pulumi/kubernetes"
  - protobufjs
